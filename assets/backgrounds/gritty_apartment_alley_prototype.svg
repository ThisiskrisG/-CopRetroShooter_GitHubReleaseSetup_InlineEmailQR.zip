<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="60%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#171109"/>
    </linearGradient>
    <linearGradient id="buildingShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24272e"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <radialGradient id="streetLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd38a" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#c98948" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="spraySoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#nightSky)"/>

  <!-- Apartment blocks (multi-floor) -->
  <g transform="translate(120,120)">
    <rect width="680" height="760" fill="url(#buildingShade)"/>
    <rect x="800" y="-40" width="980" height="880" fill="#1a1d24"/>

    <!-- Window grids -->
    <g fill="#2b2f39">
      <g id="leftWindows">
        <rect x="50" y="70" width="70" height="40"/>
        <rect x="170" y="70" width="70" height="40"/>
        <rect x="290" y="70" width="70" height="40"/>
        <rect x="410" y="70" width="70" height="40"/>
        <rect x="530" y="70" width="70" height="40"/>
      </g>
      <use href="#leftWindows" y="95"/>
      <use href="#leftWindows" y="190"/>
      <use href="#leftWindows" y="285"/>
      <use href="#leftWindows" y="380"/>
      <use href="#leftWindows" y="475"/>
      <use href="#leftWindows" y="570"/>
    </g>

    <g fill="#2a2d35">
      <g id="rightWindows">
        <rect x="860" y="35" width="88" height="46"/>
        <rect x="1000" y="35" width="88" height="46"/>
        <rect x="1140" y="35" width="88" height="46"/>
        <rect x="1280" y="35" width="88" height="46"/>
        <rect x="1420" y="35" width="88" height="46"/>
        <rect x="1560" y="35" width="88" height="46"/>
      </g>
      <use href="#rightWindows" y="100"/>
      <use href="#rightWindows" y="200"/>
      <use href="#rightWindows" y="300"/>
      <use href="#rightWindows" y="400"/>
      <use href="#rightWindows" y="500"/>
      <use href="#rightWindows" y="600"/>
      <use href="#rightWindows" y="700"/>
    </g>

    <!-- Lit windows for moody lighting -->
    <g fill="#f5c77d" opacity="0.9">
      <rect x="170" y="260" width="70" height="40"/>
      <rect x="530" y="545" width="70" height="40"/>
      <rect x="1000" y="435" width="88" height="46"/>
      <rect x="1420" y="235" width="88" height="46"/>
      <rect x="1560" y="635" width="88" height="46"/>
    </g>
  </g>

  <!-- Alley floor -->
  <polygon points="0,880 1920,880 1920,1080 0,1080" fill="#1a1a1d"/>
  <polygon points="220,880 1700,880 1320,1080 560,1080" fill="#23262b"/>

  <!-- Streetlight poles and glow -->
  <rect x="420" y="500" width="14" height="380" fill="#252629"/>
  <rect x="420" y="500" width="95" height="10" fill="#252629"/>
  <circle cx="520" cy="506" r="12" fill="#ffc97d"/>
  <circle cx="520" cy="506" r="220" fill="url(#streetLampGlow)"/>

  <rect x="1490" y="460" width="14" height="420" fill="#232427"/>
  <rect x="1410" y="460" width="94" height="10" fill="#232427"/>
  <circle cx="1410" cy="466" r="12" fill="#ffc97d"/>
  <circle cx="1410" cy="466" r="240" fill="url(#streetLampGlow)"/>

  <!-- Graffiti / spray paint on walls -->
  <g transform="translate(260,720)">
    <path d="M0 70 C40 5, 85 5, 120 70 C95 62, 45 62, 0 70Z" fill="#f03e63" filter="url(#spraySoft)"/>
    <text x="8" y="65" font-family="Impact, Arial Black, sans-serif" font-size="62" fill="#ff5d7e" transform="skewX(-8)">RAGE</text>
  </g>

  <g transform="translate(980,760)">
    <text x="0" y="0" font-family="Impact, Arial Black, sans-serif" font-size="78" fill="#2ae1cf" opacity="0.88" transform="rotate(-6)">NOPE</text>
    <text x="10" y="8" font-family="Impact, Arial Black, sans-serif" font-size="78" fill="#0a5951" opacity="0.45" transform="rotate(-6)">NOPE</text>
  </g>

  <g transform="translate(1280,820)">
    <path d="M8 8 L180 0 L172 64 L0 72 Z" fill="#d8c23d" opacity="0.18"/>
    <text x="10" y="58" font-family="Courier New, monospace" font-size="52" fill="#d8c23d" opacity="0.78">BLOCK 9</text>
  </g>

  <!-- Grit overlay -->
  <rect width="1920" height="1080" filter="url(#grit)"/>
</svg>
